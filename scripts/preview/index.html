<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Takya · Visual QA</title>
        <style>
            @font-face {
                font-family: Avenir-Regular;
                src: url('/fonts/Avenir-Regular.otf');
            }
            @font-face {
                font-family: Avenir-Medium;
                src: url('/fonts/Avenir-Medium.otf');
            }
            @font-face {
                font-family: Avenir-Heavy;
                src: url('/fonts/Avenir-Heavy.otf');
            }
            @font-face {
                font-family: Avenir-Black;
                src: url('/fonts/Avenir-Black.otf');
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #e7e8e3;
                font-family: Arial, sans-serif;
                color: #20251f;
            }
            #root {
                min-height: 100vh;
            }
            button,
            select {
                font: inherit;
            }
            button {
                cursor: pointer;
            }
            .qa {
                display: flex;
                gap: 32px;
                align-items: flex-start;
                justify-content: center;
                padding: 24px;
            }
            .controls {
                width: 224px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding-top: 30px;
            }
            .controls h1 {
                font-size: 22px;
                margin: 0;
            }
            .controls p {
                font-size: 13px;
                line-height: 1.6;
                margin: 0;
            }
            .controls select,
            .controls button {
                padding: 10px;
                border: 1px solid #bfc3b9;
                border-radius: 8px;
                background: white;
            }
            .phone {
                flex-shrink: 0;
                height: 844px;
                overflow: hidden;
                border: 1px solid #c9cdc3;
                border-radius: 30px;
                display: flex;
                flex-direction: column;
                box-shadow: 0 12px 50px #20251f18;
            }
            .status {
                height: 42px;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 27px;
                font-size: 13px;
                font-weight: 600;
            }
            .app {
                display: flex;
                flex: 1;
                min-height: 0;
            }
            .homebar {
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .homebar:after {
                content: '';
                width: 120px;
                height: 4px;
                background: currentColor;
                border-radius: 4px;
            }
            @media (max-width: 700px) {
                .qa {
                    padding: 0;
                    display: block;
                }
                .controls {
                    width: auto;
                    padding: 12px;
                    flex-direction: row;
                    flex-wrap: wrap;
                    gap: 8px;
                }
                .controls h1,
                .controls p {
                    display: none;
                }
                .phone {
                    max-width: 100%;
                    margin: auto;
                    border-radius: 0;
                    height: calc(100dvh - 108px);
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script src="/app.js"></script>
    </body>
</html>
