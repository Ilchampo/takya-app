name: Bug report
description: Report a problem with Takya
title: '[Bug]: '
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a bug.

              Do not include real license plates, names, identity documents, or
              incident details. Use debug fixtures `ABC-1111`–`ABC-5555` when a
              plate is needed.
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: A clear description of the bug.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1.
              2.
              3.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true
    - type: input
      id: version
      attributes:
          label: App version
          placeholder: '1.0.0'
    - type: dropdown
      id: platform
      attributes:
          label: Platform
          options:
              - Android
              - iOS
              - Expo Go
              - Not sure
    - type: input
      id: os
      attributes:
          label: OS version
          placeholder: Android 15, iOS 18, …
    - type: textarea
      id: extra
      attributes:
          label: Additional context
          description: Screenshots, logs, or notes. Redact personal data.
