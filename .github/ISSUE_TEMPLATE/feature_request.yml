name: Feature request
description: Suggest an idea for Takya
title: '[Feature]: '
labels: [enhancement]
body:
    - type: markdown
      attributes:
          value: |
              Please describe the problem and the outcome you want. Keep personal
              data out of the request.
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What is hard or missing today?
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: What would you like Takya to do?
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
    - type: textarea
      id: extra
      attributes:
          label: Additional context
